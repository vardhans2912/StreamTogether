spring.application.name=media-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/media_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=${JWT_SECRET}
streamtogether.gateway-url=${GATEWAY_URL:http://localhost:8080}

# Origins allowed to open the /ws handshake. The browser's Origin is the SPA's,
# not the gateway's, so this mirrors the gateway CORS config.
streamtogether.realtime.allowed-origins=${REALTIME_ALLOWED_ORIGINS:http://localhost:5173}